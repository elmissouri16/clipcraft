<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="panel.css"><script src="panel.js" defer></script><title>Preference workbench</title></head>
<body><main><p class="eyebrow" id="version">Preference workbench</p><h1>Make it yours</h1><p>This panel stores its own preferences. Save them, install the second demo version, then copy selected keys in Settings → Plugins.</p>
<form id="preferences"><label>Workspace label<input id="label" maxlength="80" value="My editing desk" required></label><label>Accent<select id="accent"><option value="violet">Violet</option><option value="amber">Amber</option><option value="teal">Teal</option></select></label><label>Row spacing<select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label><div class="sample" id="sample"><span>Preview</span><strong id="sample-label">My editing desk</strong><span>Preferences stay separate from the project.</span></div><button type="submit" id="save" disabled>Save preferences</button></form><p id="status" role="status">Reading saved preferences…</p></main></body></html>
