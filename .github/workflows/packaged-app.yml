name: Packaged app acceptance

# Builds the release-configuration installer on each supported platform, installs it on the
# runner and drives the installed application (scripts/verify-packaged-app.cjs). Nothing is
# published and installers are not retained: only the receipt, log, screenshot and export are.

on:
  pull_request:
  push:
    # The feature branch is listed while the plugin system is validated before its merge.
    branches: [main, 'release/**', 'feat/plugin-system-foundation']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaged-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Installed app on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux deb --x64
          - os: windows-latest
            target: --win nsis --x64
          - os: macos-latest
            target: --mac dmg --universal
    env:
      EVIDENCE: ${{ github.workspace }}/packaged-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the renderer
        run: npm run build
      - name: Package with the release configuration
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node scripts/prepare-release-config.cjs
          npx electron-builder --config electron-builder.release.json ${{ matrix.target }} --publish never
          ls -l release
      - name: Install and verify (Linux)
        if: runner.os == 'Linux'
        run: |
          installer=$(ls release/*.deb)
          sudo apt-get update
          sudo apt-get install -y xvfb "./$installer"
          xvfb-run -a node scripts/verify-packaged-app.cjs --app /opt/ClipCraft --installer "$installer" --output "$EVIDENCE"
      - name: Install and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release -Filter 'ClipCraft-Setup-*.exe' | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'ClipCraft.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'The installer did not install ClipCraft.exe.' }
          node scripts/verify-packaged-app.cjs --app $app.DirectoryName --installer $installer --output $env:EVIDENCE
      - name: Install and verify (macOS)
        if: runner.os == 'macOS'
        run: |
          installer=$(ls release/*.dmg | head -1)
          hdiutil attach "$installer" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/clipcraft-dmg"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/clipcraft-dmg/ClipCraft.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/clipcraft-dmg"
          node scripts/verify-packaged-app.cjs --app "$RUNNER_TEMP/Applications/ClipCraft.app" --installer "$installer" --output "$EVIDENCE"
      - name: Retain receipt, log, screenshot and export
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-app-${{ matrix.os }}
          path: |
            packaged-evidence/receipt.json
            packaged-evidence/application.log
            packaged-evidence/editor.png
            packaged-evidence/export.mp4
          if-no-files-found: warn
          retention-days: 14
