name: Plugin SDK validation

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SDK on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.19.0', '24.22.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Electron's dependency installer needs Node >=22.12. SDK checks run
      # afterwards on the selected authoring runtime, including the exact floor.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/plugin-sdk/package-lock.json
      - name: Install pinned development dependencies
        run: npm ci --no-audit --no-fund
      - name: Cache exact SDK dependencies for offline consumer checks
        run: npm ci --prefix packages/plugin-sdk --ignore-scripts --no-audit --no-fund
      - name: Prepare registry metadata for offline consumer checks
        run: npm run sdk:cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate contracts, authoring and candidate artifact
        env:
          SDK_VALIDATION_OUTPUT: ${{ runner.temp }}/sdk-validation
        run: npm run sdk:verify -- --output "$SDK_VALIDATION_OUTPUT"
        shell: bash
      - name: Retain report, logs and successful candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-validation-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/sdk-validation
          if-no-files-found: warn
          retention-days: 14

  sdk-validation:
    name: SDK validation
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: test "$MATRIX_RESULT" = success
