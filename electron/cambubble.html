<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; media-src 'self' blob: mediastream:" />
  <title>Camera</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font: 600 12px "Segoe UI", system-ui, sans-serif; }
    /* The picture is drawn into a canvas cut to the shape: CSS rounding does not clip a camera <video> reliably. */
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-app-region: drag; }
    video { display: none; }
    .msg { position: absolute; inset: var(--room, 0px); border-radius: 50%; background: #111; display: grid; place-items: center; color: #ddd; text-align: center; padding: 12px; pointer-events: none; }
    .tools {
      position: absolute; left: 50%; bottom: calc(var(--room, 0px) + 14px); transform: translateX(-50%); display: flex; gap: 4px; padding: 4px;
      border-radius: 16px; background: rgba(15, 17, 24, 0.85); opacity: 0; transition: opacity 0.15s; -webkit-app-region: no-drag;
    }
    body:hover .tools { opacity: 1; }
    button { width: 26px; height: 26px; border: 0; border-radius: 13px; background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; font: inherit; }
    button:hover, button.on { background: rgba(255, 255, 255, 0.2); }
    .shape-c { width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; }
    .shape-s { width: 12px; height: 12px; border: 2px solid #fff; border-radius: 3px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <video id="v" autoplay muted playsinline></video>
  <div class="msg" id="msg" hidden></div>
  <div class="tools">
    <button id="circle" title="Round"><span class="shape-c"></span></button>
    <button id="square" title="Square"><span class="shape-s"></span></button>
    <button id="smaller" title="Smaller">−</button>
    <button id="bigger" title="Bigger">+</button>
  </div>
  <script src="cambubble.js"></script>
</body>
</html>
