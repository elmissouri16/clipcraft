<!doctype html>
<!-- Motion graphics sandbox: renders one graphic component frame by frame in a hidden, locked-down
     window (electron/graphics/render.cjs). No network: the policy allows only this page's own
     runtime, the component handed over as a blob, and inline styles and images it builds itself. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src 'self' data:">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; }
  #stage > svg { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="runtime.js"></script>
</body>
</html>
